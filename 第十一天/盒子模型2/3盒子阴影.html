<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子阴影</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        div {
            width: 300px;
            height: 300px;
            background-color: pink;
            margin: 100px auto;
            border-radius: 30px;
            /* 1.左右移 2.上下移 3.虚实 4.范围  5.颜色 6.默认是外阴影outset（不用输），写了可以把外阴影改为内阴影 inset */
            /* box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, .3); */
        }

        /* 原先没有影子，鼠标经过才有 */
        div:hover {
            box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, .3);
        }
    </style>
</head>

<body>
    <div>
    </div>
</body>

</html>
