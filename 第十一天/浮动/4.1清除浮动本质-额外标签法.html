<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除浮动</title>
    <style>
        .box {
            width: 800px;
            border: 1px solid blue;
            margin: 0 auto;
        }

        .damao {
            width: 300px;
            height: 200px;
            background-color: #0011ff;
            float: left;
        }

        .ermao {
            width: 200px;
            height: 200px;
            background-color: #73ff00;
            float: left;
        }

        .footer {
            width: 1000px;
            height: 200px;
            background-color: black;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="damao">大毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>
        <div class="ermao">二毛</div>

        <!-- <div class="clear"></div>
        这个新增的盒子要求必须是块级元素不能是行内元素，比如用span就不行 -->

        <div class="clear"></div>
    </div>
    <div class="footer"></div>
</body>

</html>
