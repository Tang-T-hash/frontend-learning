<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图片</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: pink;
            background-image: url(images/王者荣耀.webp);
            background-repeat: no-repeat;

            /* background-position: 0 0;方位名词 */
            /* background-position: center top; */
            /* background-position: top center; */
            /* 如果是方位名词 right center 和 center right 效果是一样的 跟顺序无关 */
            background-position: center right;
            /* 此时 水平一定是靠右侧对齐  第二个参数省略 y 轴是垂直居中显示的 */
            /* background-position: right; */
            /* 此时 第一个参数一定是top y 轴 顶部对齐   第二个参数省略x 轴是水平居中显示的 */
            background-position: top;
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
