<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      float: left;
      width: 400px;
      height: 400px;
      background: pink;
      transition: all 0.5s;
    }

    .box:hover {
      box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);
      background-color: red;
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</body>

</html>
