<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快报模板</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        li {
            list-style: none;
        }

        .box {
            width: 230px;
            height: 200px;
            margin: 100px auto;
            border: 1px dashed #000000;

        }

        .box p {
            height: 35px;
            color: rgb(133, 83, 83);
            font-weight: 400;
            line-height: 35px;
            padding-left: 15px;
            border-bottom: 1px dashed #000000;
        }

        .box ul li a {
            color: #000000;
            font-size: 15px;
            text-decoration: none;
        }

        .box ul li a:hover {
            text-decoration: underline;
        }

        .box ul li {
            padding-left: 20px;
            height: 23px;
            line-height: 23px;
        }

        .box ul {
            margin-top: 7px;
        }
    </style>
</head>

<body>
    <div class="box">
        <p>品优购快报</p>
        <ul>
            <li><a href="#">特惠11111111</a></li>
            <li><a href="#">特惠22222222</a></li>
            <li><a href="#">特惠222222222</a></li>
            <li><a href="#">特惠22222222</a></li>
            <li><a href="#">特惠22222222222</a></li>
        </ul>
    </div>
</body>

</html>
