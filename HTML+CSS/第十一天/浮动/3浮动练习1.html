<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动练习1</title>
    <style>
        .box {
            width: 1000px;
            height: 400px;
            background-color: pink;
            margin: 0 auto;
        }

        .left {
            width: 200px;
            height: 400px;
            background-color: #fbff00;
            float: left;
        }

        .right {
            width: 800px;
            height: 400px;
            background-color: skyblue;
            float: left;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left">1</div>
        <div class="right">2</div>
    </div>
</body>

</html>
