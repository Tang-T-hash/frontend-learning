<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS字体属性之字体系列</title>
    <style>
        p {
            font-family: "Microsoft YaHei", 'Times New Roman', Times, serif;
        }
        body {
            font-size: 16px;
        }
        /* 标题标签比较特殊，需要单独指定文字大小 */
        /*  h3 {
            font-size: 20px;
         } */
          h3 {
            font-weight: 400;
            /* font-weight: normal;和400效果一样 */
          }
         .bold {
            font-weight: bold;
                  }
                  .bolder {
                    /* 这个700后面不要跟单位 等价于 bold 都是加粗的效果 */
                    /* 实际开发中，我们更提倡使用数字 表示加粗或者变细 */
                    font-weight: 700;
                  }
                    .bujiacu {
                        font-weight: 400;
                    }
    </style>
</head>
<body>
    <h3>pink</h3>
    <p>锄禾日当午</p>
    <p class="bolder">汗滴禾下土</p>
    <strong><p class="bujiacu">谁知盘中餐</p></strong>
    <p class="bold">粒粒皆辛苦</p>
</body>
</html>
