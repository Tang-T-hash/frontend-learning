<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权重练习2</title>
    <style>
        /* 权重是11 */
        .nav li {
            color: red;
        }

        /* 把第一个小li  颜色改为  粉色加粗 */
        .nav .one {
            color: pink;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <ul class="nav">
        <li class="one">红烧牛肉面</li>
        <li>红烧牛肉面</li>
        <li>红烧牛肉面</li>
    </ul>
</body>

</html>
