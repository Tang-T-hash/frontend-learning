<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权重注意点</title>
    <style>
        /* 父亲的权重是100 */
        #father {
            color: red;
        }

        /* p 继承的权重是0 */
        /* 所以以后我们看到标签到底执行那个样式，就先看这个标签有没有直接被选出来 */
        p {
            color: pink;
        }

        /* a 链接浏览器默认制定了一个样式  蓝色的  有下划线  a {color：blue；} */
        a {
            color: green;
        }
    </style>
</head>

<body>
    <div id="father">
        <p>降维打击</p>
    </div>
    <a href="#">牛来</a>
</body>

</html>
