<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <!-- text 文本框 用户可以里面输入任何文字-->
        用户名：<input type="text" name="username" value="请输入用户名"><br />

        
 <!-- password 密码框 用户看不见输入的密码 -->
        密码：<input type="password" name="pwd"><br />


        <!-- radio 单选按钮  可以实现多选 -->
         <!-- name 是表单元素名字 这里性别单选按钮必须有相同的名字name 才可以多选一 -->
       性别： 男<input type="radio" name="username" value="男"> 女<input type="radio" name="username" value="女"> 人妖<input type="radio" name="username" value="人妖"><br />


       <!-- checkbox  （复选框）多选按钮 可以实现多选  -->
       爱好：吃饭<input type="checkbox" name="hobby">  睡觉<input type="checkbox" name="hobby"> 打游戏<input type="checkbox" name="hobby">
    </form>
</body>
</html>
