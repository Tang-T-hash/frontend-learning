<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定定位小技巧</title>
    <style>
        .fixed {
            width: 700px;
            height: 1100px;
            background-color: pink;
            margin: auto;
        }

        .w {
            position: fixed;
            /* 1.走浏览器宽度的一半 */
            left: 50%;
            /* 2.利用margin  走版心盒子宽度的一半 */
            margin-left: 350px;
            width: 40px;
            height: 100px;
            background-color: purple;
        }
    </style>
</head>

<body>
    <div class="w"></div>
    <div class="fixed">版心盒子</div>

</body>

</html>
