<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像标签</title>
</head>
<body>
    <h4>图像标签的使用：</h4>
    <img src="2.jpg"/>
    <h4>alt 替换文本图像显示不出来的时候用文字替换:</h4>
    <img src="4.jpg" alt="我是niko"/>
    <h4>title 提示文本鼠标放到图像上,提示的文字:</h4>
    <img src="2.jpg" alt="我是niko" title="我是niko思密达"/>
    
    <h4>width   像素   设置图像的宽度</h4>
    <img src="2.jpg" alt="我是niko" title="我是niko思密达" width="500"/>
    
    <h4>height  像素   设置图像的高度</h4>
    <img src="2.jpg" alt="我是niko" title="我是niko思密达" width="500" height="200"/>
    <h4>height  像素   设置图像的高度</h4>
    <img src="2.jpg" alt="我是niko" title="我是niko思密达"  height="200"/>
    
    <h4>border  像素   设置图像的边框粗细</h4>
    <img src="2.jpg" alt="我是niko" title="我是niko思密达" width="500"  border="15"/>
    <a href="https://data.wanmei.com/csgo/players/3741" target="_blank"><img src="2.jpg" width="500"></a>
</body>
</html>
