<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f5f5;
        }

        .box {
            width: 234px;
            height: 300px;
            background-color: #fff;
            margin: 100px;
            text-align: center;
        }

        .one {
            color: #b0b0b0;
            font-size: 12px;
            font-weight: 400;
            margin: 0px 10px 10px 10px;
        }

        .two {
            font-size: 14px;
            font-weight: 400;
            color: #333;
            margin: 0px 10px 2px 10px;
        }

        .three {
            font-size: 14px;
            color: #ff6700;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="images/1.webp" alt="">
        <p class="two">REDMI Note 17 Pro</p>
        <p class="one">抗摔 防水 长续航</p>
        <p class="three">1599元起</p>
    </div>
</body>

</html>
