<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ul {
      list-style: none;
    }

    ul .item1 {
      width: 125px;
      height: 144px;
      background: url(./images/1672797613116724.jpg) no-repeat -460px -510px;
    }

    ul .item2 {
      width: 127px;
      height: 134px;
      background: url(./images/1672797613116724.jpg) no-repeat -488px -174px;
    }

    ul .item3 {
      width: 124px;
      height: 128px;
      background: url(./images/1672797613116724.jpg) no-repeat -277px -175px;
    }
  </style>
</head>

<body>
  <ul>
    <li class="item1"></li>
    <li class="item2"></li>
    <li class="item3"></li>

  </ul>
</body>

</html>
