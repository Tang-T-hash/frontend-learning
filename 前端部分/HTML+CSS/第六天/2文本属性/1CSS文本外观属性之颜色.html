<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本外观属性之颜色</title>
    <style>
        p {
            /* color: pink; */
            color: #ff0000;
        }
        div {
            color: rgb(255, 0, 255);
        }
    </style>
</head>
<body>
    <p>真没胖</p>
    <div>我原本没想降维打击</div>
</body>
</html>
