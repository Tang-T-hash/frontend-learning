<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本外观属性之文本缩进</title>
    <style>
        p {
            /* 文本的第一行首行缩进 多少距离 */
            /* text-indent: 20px; */
            /* 如果此时写了2em 则是缩进当前元素 2个文字的距离 */
            text-indent: 2em;
        }
    </style>
</head>
<body>
    <p>“根河被称为冷极，所以家家户户即使不住的话，房子也不能停暖。”赵女士介绍，当地一般到第二年6月1日停止供暖。停暖后，屋子里仍会感觉凉，一般到6月末左右可能才会正式暖和起来。7月份是根河最暖和的时候，有几天白天气温也能达到30摄氏度以上。
    </p>
    <p>另一位来自根河的居民告诉极目新闻记者，当地从9月1日开始供暖，供暖有九个月，目前屋内温度有20摄氏度左右，在屋里可以穿半袖，出门则要穿小棉服。</p>

    <p>另有根河居民表示，现在早晚出去遛弯都得穿棉服，他们也已经习惯了这样的天气，“不早点供暖也不行，天实在是太冷了。”</p>
</body>
</html>
