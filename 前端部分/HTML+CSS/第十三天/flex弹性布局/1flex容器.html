<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>容器flex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            /* 1.父元素添加弹性布局 */
            display: flex;
            width: 500px;
            height: 100px;
            border: 1px solid red;
            margin: 20px 0 0 10px;
        }

        .box .item {
            /* 子盒子没有高宽，拉伸至充满父容器 */
            /* width: 100px;
            height: 100px; */
            width: 100px;
            height: 100px;
            background-color: pink;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="item">11111</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>

    </div>
</body>

</html>
