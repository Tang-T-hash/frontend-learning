<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伪元素选择器</title>
  <style>
    /* 选择首行 */
    p::first-line {
      color: #ff6900;
    }

    /* 选择首字母 */
    p::first-letter {
      color: rgb(17, 0, 255);
      font-size: 28px;
    }

    /* 这样不能控制他的颜色
    textarea {
      color: rgb(192, 255, 220);
      font-size: 14px;
    } */
    textarea::placeholder {
      color: rgb(7, 197, 93);
      font-size: 14px;
    }

    .box::before {
      content: "开始";
    }

    .box::after {
      content: "结束";
    }
  </style>
</head>

<body>
  <p>伪元素选择器：1.伪元素选择器是通
    过元素的特殊状态来选择元素的。 2.
    伪元素选择器是通过元素的特殊状态
    来选择元素的。 3.伪元素选择器是通
    过元素的特殊状态来选择元素的。</p>
  <textarea name="" id="" placeholder="请您留言"></textarea>
  <div class="box">pink</div>
</body>

</html>
