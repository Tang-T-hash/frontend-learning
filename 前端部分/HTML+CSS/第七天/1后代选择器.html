<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后代选择器</title>
    <style>
        ul li {
            color: rgb(30, 255, 0);
        }

        ul li a {
            color: pink;
        }
    </style>
</head>

<body>
    <ul>
        牛逼
        <li>我是ul后代</li>
        <li>我是ul后代</li>
        <li><a href="#">牛逼</a></li>
    </ul>
    <ol>
        <li>我是ol后代</li>
        <li>我是ol后代</li>
        <li>我是ol后代</li>
    </ol>
    <ol>
        <li>我是ol后代</li>
        <li>我是ol后代</li>
        <li>我是ol后代</li>
        <li><a href="#">不牛逼</a></li>
    </ol>

</body>

</html>
