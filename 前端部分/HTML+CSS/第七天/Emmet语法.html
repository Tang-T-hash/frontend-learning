<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet语法</title>
    <style>
        .div {
            /* tac */
            text-align: center;
            /* ti */
            text-indent: 2em;
            /* w100 */
            width: 100px;
            /* h200 */
            height: 200px;
            /* ti2em */
            text-indent: 2em;
            /* lh26px */
            line-height: 26px;
            /* tdn */
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- div*10 -->
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>


    <!-- p*11 -->
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p></p>


    <!-- ul>li 父子关系 -->
    <ul>
        <li>1</li>
    </ul>


    <!-- ul>li*3 -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>



    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- ul*3>li*3 -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>


    <!-- 兄弟关系 p+div -->
    <p></p>
    <div></div>

    <!-- .nav -->
    <div class="nav"></div>

    <!-- p.nav -->
    <p class="nav"></p>

    <!-- #nav -->
    <div id="nav"></div>

    <!-- p#nav -->
    <p id="nav"></p>


    <!-- .demo$*5 -->
    <div class="demo1"></div>
    <div class="demo2"></div>
    <div class="demo3"></div>
    <div class="demo4"></div>
    <div class="demo5"></div>



    <!-- div{牛逼}*5 -->
    <div>牛逼</div>
    <div>牛逼</div>
    <div>牛逼</div>
    <div>牛逼</div>
    <div>牛逼</div>

    <!-- div{$}*5   -->
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>

</body>

</html>
