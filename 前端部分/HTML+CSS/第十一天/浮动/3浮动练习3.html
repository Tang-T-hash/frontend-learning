<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动练习3</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        li {
            list-style: none;
        }

        .box {
            width: 1000px;
            height: 400px;
            background-color: pink;
            margin: 0 auto;
            border-radius: 100px;
        }

        .left {
            width: 196px;
            height: 400px;
            background-color: rgb(0, 89, 255);
            float: left;
            margin-right: 4px;
            border-radius: 30px;
        }

        .left:hover {
            box-shadow: 5px 5px 5px 5px skyblue;
        }

        .right {
            width: 800px;
            height: 400px;
            background-color: #00aeff;
            float: left;
            border-radius: 30px;
        }

        .box .right .top li {
            width: 196px;
            height: 196px;
            background-color: #1900fd;
            float: left;
            margin-right: 4px;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .box .right .top li:hover {
            box-shadow: 5px 5px 5px 5px skyblue;
        }

        .box .right .bottom li {
            width: 196px;
            height: 196px;
            background-color: #1900fd;
            float: left;
            margin-right: 4px;
            border-radius: 10px;
        }

        .box .right .bottom li:hover {
            box-shadow: 5px 5px 5px 5px skyblue;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left"></div>
        <div class="right">
            <ul class="top">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </ul>
            <ul class="bottom">
                <li>5</li>
                <li>6</li>
                <li>7</li>
                <li>8</li>
            </ul>
        </div>
    </div>
</body>

</html>
