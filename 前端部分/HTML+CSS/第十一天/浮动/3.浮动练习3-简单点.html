<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动练习3</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .box {
            width: 1000px;
            height: 400px;
            background-color: pink;
            margin: 0 auto;
        }

        .left {
            width: 196px;
            height: 400px;
            background-color: rgb(0, 89, 255);
            float: left;
            border-radius: 20px;
        }

        .left:hover {
            box-shadow: 5px 5px 5px 5px rgb(1, 212, 1);
        }

        .right>div {
            width: 196px;
            height: 197px;
            background-color: #ae00ff;
            float: left;
            margin-left: 5px;
            margin-bottom: 5px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left"></div>
        <div class="right">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
        </div>
    </div>
</body>

</html>
