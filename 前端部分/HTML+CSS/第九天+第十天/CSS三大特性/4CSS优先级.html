<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS优先级</title>
    <style>
        div {
            color: pink !important;
            /* 只要加这个！important就是权重最高的 */
        }

        /* 类选择器权重 > 元素选择器权重 所以执行类选择器 */
        .nav {
            color: red;
        }

        /* ID选择器权重 > 类选择器权重 所以执行ID选择器 */
        #demo {
            color: green;
        }
    </style>
</head>

<body>
    <!-- 行内样式style权重 > ID选择器权重 所以执行行内样式 -->
    <div class="nav" id="demo" style="color: purple;">你笑起来真好看</div>
</body>

</html>
