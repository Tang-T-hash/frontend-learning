<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 创建 Promise 对象
    const p = new Promise((resolve, reject) => {
      //2.执行异步代码
      setTimeout(() => {
        // resolve('成功结果')
        reject(new Error('失败结果'))

      }, 2000)
    })
    // 获取结果
    p.then(result => {
      console.log(result)
    }).catch(error => {
      console.log(error)
    })
  </script>
</body>

</html>
