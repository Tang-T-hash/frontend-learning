<body>
  <script>
    let arr = ['pink', 'red', 'green', 'blue']
    // 1.删除数组的最后一个元素
    // arr.pop()    不带参数
    // arr.pop()
    // 2.删除数组的第一个元素
    // arr.shift()     不带参数
    // arr.shift()  

    // 3.删除指定的元素 splice（起始位置-索引号， 删除几个元素）
    arr.splice(1, 2)    // 从索引号1 开始往后删除 2个元素
    // arr.splice(1)   从索引号1删除到最后
    console.log(arr);
  </script>
