<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let money = 1000
    while (true) {
      let num = +prompt(`
      请选择您的操作:
      1. 存款
      2. 取款
      3. 查询余额
      4. 退出
      `)
      if (num === 4) {
        break
      }
      switch (num) {
        case 1:
          let cun = +prompt(`请输入存款金额`)
          money += cun
          break
        case 2:
          let qu = +prompt(`请输入取款金额`)
          if (qu > money) {
            alert(`您的余额不足`)
            break
          }
          money -= qu
          break
        case 3:
          alert(`您的余额为${money}`)
          break
      }
      num++
    }
  </script>
</body>

</html>
