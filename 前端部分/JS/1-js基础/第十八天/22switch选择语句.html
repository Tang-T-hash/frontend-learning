<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    switch (6) {
      case 1:
        console.log('你选择的是1')
        break   // 退出switch语句
      case 2:
        console.log('你选择的是2')
        break   // 退出switch语句
      case 3:
        console.log('你选择的是3')
        break   // 退出switch语句
      default:
        console.log('你选择的不是1也不是2也不是3')
    }
  </script>
</body>

</html>
