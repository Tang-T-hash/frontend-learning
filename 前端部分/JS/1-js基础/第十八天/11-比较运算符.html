<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    console.log(10 > 5)
    console.log(5 > 10)
    console.log(3 >= 3)
    // 比较运算符有隐形转换  会将字符串转换为数字型  双等号  只判断值
    console.log(3 == '3')
    // === 全等 判断  值 和 数据类型都一样才行
    console.log(3 === '3')
    console.log(3 !== '3')
    console.log(NaN === NaN)   // Nan 不等于任何人 包括他自己
  </script>
</body>

</html>
