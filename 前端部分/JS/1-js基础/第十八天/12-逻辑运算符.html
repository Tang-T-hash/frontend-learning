<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.逻辑与运算符  一假则假
    console.log(true && true)
    console.log(true && false)
    console.log(false && true)
    console.log(3 < 5 && 4 < 5)
    console.log(3 > 5 && 4 > 5)
    console.log(`-------------------------------`)
    // 2.逻辑或运算符   一真则真
    console.log(true || true)
    console.log(true || false)
    console.log(false || false)
    console.log(3 < 5 || 4 < 5)
    console.log(`-------------------------------`)
    // 3.逻辑非运算符  取反
    console.log(!true)
    console.log(!false)
    console.log(!3 < 5)
    console.log(`-------------------------------`)

    let num = 2
    console.log(num > 5 && num < 10)
  </script>
</body>

</html>
