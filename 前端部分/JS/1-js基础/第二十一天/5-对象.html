<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.声明对象
    let goods = {
      name: `小米10青春版`,
      num: `100012816024`,
      weight: `0.55kg`,
      address: `中国大陆`
    }
    // 2.使用属性 查  对象名.属性名
    console.log(goods.name)
    console.log(goods.address)

    // 3.如果这个属性有加了就是 修改
    goods.weight = `0.5kg`
    console.log(goods.weight)
    //4.如果这个属性没有加就是 新增
    goods.price = `3999元`
    console.log(goods.price)

    // 5.删除属性   了解
    delete goods.num
    console.log(goods.num)
  </script>
</body>

</html>
