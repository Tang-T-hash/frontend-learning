<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 常量  不能改变的变量
    const PI = 3.14
    console.log(PI)
    // 不能连续改变值
    PI = 3.15
    console.log(PI)
    // 常量声明时必须赋值
    //  const PI  错误的
  </script>
</body>

</html>
