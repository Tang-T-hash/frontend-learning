<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

<body>
  <script>
    // 数组的reduce方法
    // arr.reduce(function(上一次值， 当前值) {}， 初始值)

    const arr = [4, 6, 8]

    // 1.没有初始值
    // const sum = arr.reduce(function (prev, current) {
    //   return prev + current
    // })
    // console.log(sum)


    // 没有初始值时的执行过程
    // 上一次值     当前值     返回值(第一次循环)
    // 4             6             10
    // 上一次值     当前值     返回值(第二次循环)
    // 10            8             18


    //2. 有初始值
    const sum = arr.reduce(function (prev, current) {
      return prev + current
    }, 100)
    console.log(sum)

    // 有初始值时的执行过程
    // 上一次值     当前值     返回值(第一次循环)
    // 100           4             104
    // 上一次值     当前值     返回值(第二次循环)
    // 104           6             110
    // 上一次值     当前值     返回值(第三次循环)
    // 110           8             118




    // 3,箭头函数的写法
    // const sum = arr.reduce((prev, current) => prev + current, 100)
    // console.log(sum)
  </script>
</body>
