<body>
  <script>
    const arr1 = [1, 2, 3, 4, 5]
    // 展开运算符 可以展开数组
    // console.log(...arr)

    // console.log(Math.max(1, 2, 3, 4, 5))   // 5
    // ...arr === 1, 2, 3, 4, 5
    // 1.求数组的最大值
    console.log(Math.max(...arr1))   // 5
    console.log(Math.min(...arr1))   // 1

    // 合并数组
    const arr2 = [6, 7, 8, 9]
    const arr = [...arr1, ...arr2]
    console.log(arr)

  </script>
