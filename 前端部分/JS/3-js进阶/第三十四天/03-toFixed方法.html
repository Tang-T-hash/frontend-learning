<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //toFixed  方法可以让数字指定保留的小数位数
    const num = 10.9253
    console.log(num.toFixed(1))   // 四舍五入保留一位小数  10.9
    console.log(num.toFixed(2))   // 四舍五入保留两位小数  10.93
    const num1 = 10
    console.log(num1.toFixed(2))  // 10.00
  </script>
</body>

</html>
