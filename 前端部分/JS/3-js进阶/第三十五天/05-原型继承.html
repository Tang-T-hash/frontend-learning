<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 公共的部分放到原型上
    // const Person = {
    //   eyes: 2,
    //   legs: 2,
    //   head: 1
    // }

    function Person() {
      this.eyes = 2
      this.legs = 2
      this.head = 1
    }

    function Woman() { }
    // 原型继承
    // 父构造函数（父亲）  子构造函数（子类）
    // 子类的原型  =  new 父类

    Woman.prototype = new Person()
    Woman.prototype.constructor = Woman

    // 给 Woman 添加一个方法 生孩子
    Woman.prototype.baby = function () {
      console.log('宝贝')
    }
    const ldh2 = new Woman()
    // console.log(ldh2)
    console.log(ldh2)


    function Man() { }
    // 原型继承
    Man.prototype = new Person()
    Man.prototype.constructor = Man
    const ldh = new Man()
    console.log(ldh)
    // console.log(Man.prototype)

  </script>
</body>

</html>
