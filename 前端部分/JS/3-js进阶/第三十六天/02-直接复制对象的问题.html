<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const obj = {
      name: 'ldh',
      age: 18,
    }
    console.log(obj)    //{name: 'ldh', age: 18}
    const obj2 = obj
    obj2.name = 'zxy'
    console.log(obj2)    //{name: 'zxy', age: 18}
    // obj 对象里的name值也发生了变化
    console.log(obj)    //{name: 'zxy', age: 18}
  </script>
</body>

</html>
