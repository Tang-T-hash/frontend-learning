<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const obj = {
      name: '张三',
      age: 18,
      hobby: ['乒乓球', '足球'],
      family: {
        baby: '小pink'
      }
    }
    const o = {}
    // 拷贝函数
    function deepCopy(newObj, oldObj) {
      for (let k in oldObj) {
        // k  属性名  uname      oldObj[k]    属性值   18
        // 处理数组问题
        if (oldObj[k] instanceof Array) {
          newObj[k] = []
          // newObj[k]  接受 []
          // oldObj[k]   ['乒乓球'，’足球‘]
          deepCopy(newObj[k], oldObj[k])
        } else if (oldObj[k] instanceof Object) {
          newObj[k] = {}
          // newObj[k]  接受 {}
          // oldObj[k]   {baby: '小pink'}
          deepCopy(newObj[k], oldObj[k])
        } else {
          // newObj[k] = o.uname
          newObj[k] = oldObj[k]
        }

      }
    }
    deepCopy(o, obj)     // 函数调用  两个参数  o   新对象   obj   旧对象
    // o.age = 20
    o.hobby[0] = '篮球'
    o.family.baby = '老pink'
    console.log(o)
    console.log(obj)
  </script>
</body>

</html>
