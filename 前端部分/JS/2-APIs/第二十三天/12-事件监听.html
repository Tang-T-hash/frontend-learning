<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>点击我</button>
  <script>
    // 事件监听
    // 1. 先找到元素   事件源 按钮
    // 2. 监听事件
    // 事件类型 click 点击
    // 事件处理函数  要执行的函数
    const btn = document.querySelector('button')
    btn.addEventListener('click', function () {
      alert('点击了按钮')
    })
  </script>
</body>

</html>
