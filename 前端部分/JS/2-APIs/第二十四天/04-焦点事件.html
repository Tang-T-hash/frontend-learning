<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <input type="text">
  <script>
    const input = document.querySelector('input')
    // 注册事件
    // 1. 获得焦点事件
    input.addEventListener('focus', function () {
      console.log('获得焦点')
    })
    // 2. 失去焦点事件
    input.addEventListener('blur', function () {
      console.log('失去焦点')
    })
  </script>
</body>

</html>
