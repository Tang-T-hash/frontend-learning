<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理（阶段0产物）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      padding: 30px;
      color: #333;
    }

    h1 {
      font-size: 20px;
      margin: 20px 0 12px;
      color: #1f2937;
    }

    /* ===== 表单 ===== */
    .info {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .info label {
      font-size: 14px;
    }

    .info input,
    .info select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    .info input:focus,
    .info select:focus {
      border-color: #2563eb;
    }

    .info .add {
      height: 34px;
      padding: 0 20px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-left: auto;
    }

    .info .add:hover {
      background: #1d4ed8;
    }

    /* ===== 表格 ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    th,
    td {
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #eef0f3;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
      color: #4b5563;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    td a {
      color: #dc2626;
      text-decoration: none;
      font-size: 13px;
    }

    td a:hover {
      text-decoration: underline;
    }

    /* 空数据提示 */
    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 0;
    }
  </style>
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    <label>学号：<input type="text" class="id" name="id"></label>
    <label>姓名：<input type="text" class="name" name="name"></label>
    <label>年龄：<input type="text" class="age" name="age"></label>
    <label>性别：
      <select class="gender" name="gender">
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </label>
    <label>家乡：<input type="text" class="hometown" name="hometown"></label>
    <button class="add">录入</button>
  </form>

  <h1>学员列表</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>家乡</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- <td>1732</td>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
      <td>河南省</td>
      <td><a href="javascript:" data-id="1732">删除</a></td>
 -->
    </tbody>
  </table>

  <!-- ============================================================
       阶段 0 产物 · Step 5：统计条（HTML 结构自己加，就写在这）
       参考 134 案例 .title 的做法：一句话 + 两个放数字的标签
       两块数字各起一个 class（例如 .total / .average），JS 才好取
       ============================================================ -->
  <p>总共 <span class="total">0</span> 人，平均年龄 <span class="average">0</span> 岁</p>

  <script>


  </script>
</body>

</html>
