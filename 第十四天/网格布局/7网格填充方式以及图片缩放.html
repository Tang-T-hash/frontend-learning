<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      /* overflow: hidden; */
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      /* 修改网格填充方式 */
      grid-auto-flow: column;
      max-width: 1460px;
      height: 400px;
      margin: 100px auto;
      border-radius: 20px;

    }

    .box .item {
      background-color: pink;
    }

    .box .item:first-child {
      grid-row: 1 / 3;
    }

    .box .item:nth-child(3) {
      grid-column: 2 / 4;
      grid-row: 2 / 3;
    }

    .box .item img {
      width: 100%;
      height: 100%;
      display: block;
      /* object-fit: contain; */
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item">
      <img src="./images/4.0.webp" alt="">
    </div>
    <div class="item">
      <img src="./images/4.0.webp" alt="">
    </div>
    <div class="item">
      <img src="./images/4.0.webp" alt="">
    </div>
    <div class="item">
      <img src="./images/4.0.webp" alt="">
    </div>
  </div>
</body>

</html>
