<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签选择器之类选择器</title>
    <style>
        /* 类选择口诀： 样式点定义 结构类（class）调用  一个或多个 开发最常用*/
        .red {
            color: red;
        }
        .blue{
            color: blue;
        }
        .star-sing{
            color: chartreuse;
        }
    </style>
</head>
<body>
    <ul>
        <li class="red">小红</li>
        <li class="blue">小明</li>
        <li>小黑</li>
        <li class="star-sing">牛逼克拉斯</li>
    </ul>
    <div class="red">牛逼</div>
</body>
</html>
