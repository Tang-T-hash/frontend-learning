<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优医问诊-首页</title>
  <!-- 先引入网页图标 -->
  <link rel="icon" href="./优医问诊项目/favicon.ico">
  <!-- 引入CSS文件 -->
  <link rel="stylesheet" href="./CSS/base.css">
  <link rel="stylesheet" href="./CSS/index.css">
  <!-- 引入js文件 -->

</head>

<body>
  <!-- 头部制作 -->
  <div class="home-header">
    <h2>优医问诊</h2>
    <div class="search"><img src="img/search.svg" alt=""> 搜一搜：疾病/症状/医生/健康知识</div>
  </div>

  <!-- 导航栏制作 -->
  <div class="home-nav">
    <ul class="row">
      <li>
        <a href="#">
          <img src="img/doctor.svg" alt="">
          <h3>问医生</h3>
          <p>按科室查问医生</p>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="img/graphic.svg" alt="">
          <h3>极速问诊</h3>
          <p>20s医生极速回复</p>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="img/prescribe.svg" alt="">
          <h3>开药门诊</h3>
          <p>线上买药更方便</p>
        </a>
      </li>

    </ul>
    <ul class="row col-4">
      <li>
        <a href="#">
          <img src="img/order.svg" alt="">
          <p>药品订单</p>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="img/docs.svg" alt="">
          <p>健康档案</p>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="img/rp.svg" alt="">
          <p>我的处方</p>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="img/find.svg" alt="">
          <p>疾病查询</p>
        </a>
      </li>

    </ul>
    <!-- banner模块制作 -->
    <div class="banner"><img src="img/get.png" alt=""></div>
  </div>
  <!-- tabs切换模块 -->
  <div class="home-tabs">
    <div class="tabs-card">
      <ul>
        <li>关注</li>
        <li class="active">推荐</li>
        <li>护肤</li>
        <li>减脂</li>
        <li>饮食</li>
      </ul>
      <div class="line"></div>
    </div>

    <div class="home-content">
      <!-- 一个模块 -->
      <div class="con-item">
        <div class="con-head">
          <div class="avatar">头像</div>
          <div class="info">信息</div>
          <button>关注</button>
        </div>
        <div class="con-body">下</div>
      </div>
    </div>
  </div>
</body>

</html>
