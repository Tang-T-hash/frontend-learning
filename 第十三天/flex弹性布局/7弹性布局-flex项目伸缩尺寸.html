<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex项目伸缩尺寸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            gap: 10px;
            display: flex;
            width: 80%;
            border: 1px solid blue;
            margin: 0 auto;
        }

        .box .item {
            /* flex写在小盒子上 */
            /* flex: 1;表示占一份 */
            flex: 1;
            width: 80px;
            height: 100px;
            background-color: pink;
            /* margin-right: 10px; */
        }

        /* :nth-child(odd) 选中奇数位的子元素（第 1、3、5… 个）
           用奇数是为了让第 1、3 个 item 变成紫色，
           与偶数项（保持粉色）交替显示，方便区分每个项目 */
        .box .item:nth-child(odd) {
            background-color: purple;
        }

        /* .box .item:nth-child(3) {
            flex: 2;
        } */
    </style>
</head>

<body>
    <div class="box">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
</body>

</html>
