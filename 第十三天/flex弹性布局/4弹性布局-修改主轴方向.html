<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改主轴方向</title>
    <link rel="stylesheet" href="iconfont/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        .iconfont {
            font-size: 40px;
            color: rgb(0, 0, 0);
        }

        .sanlian {
            display: flex;

            margin: 20px;
            font-size: 13px;
        }

        .sanlian li {
            width: 60px;
            height: 80px;
            /* border: 1px solid red; */
        }

        .sanlian li a {
            display: flex;
            /* 改变主轴的方向 */
            flex-direction: column;
            /* 主轴居中对齐 */
            justify-content: center;
            /* 交叉轴水平居中 */
            align-items: center;
            /* a 如果给了flex布局，则可以直接设置高度和宽度 */
            height: 100%;

        }
    </style>
</head>

<body>
    <ul class="sanlian">
        <li><a href="#">
                <i class="iconfont icon-bad"></i>
                <p>点赞</p>
            </a>
        </li>
        <li><a href="#">
                <i class="iconfont icon-xihuan"></i>
                <p>喜欢</p>
            </a>
        </li>
        <li><a href="#">
                <i class="iconfont icon-yingbi"></i>
                <p>硬币</p>
            </a>
        </li>
    </ul>
</body>

</html>
