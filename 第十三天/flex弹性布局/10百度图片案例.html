<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度图片案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .col-flex {
            gap: 16px;
            display: flex;
            width: 1180px;
            margin: 20px auto;
            /* border: 1px solid red; */
        }

        .col-flex .item {
            flex: 1;
        }

        .col-flex .item a {
            /* 溢出隐藏 */
            overflow: hidden;
            display: block;
            width: 100%;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 1px solid #000;
        }

        .col-flex .item a img {
            /*1. 把图片转换为块级元素 */
            /* display: block; */
            /* 2.设置图片对齐方式不是基线对齐就行，比如垂直居中，让图片和文字底线对齐 （top bottom）*/
            vertical-align: middle;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="col-flex">
        <div class="item">
            <a href="#"><img src="images/1.0.webp" alt=""></a>
            <a href="#"><img src="images/1.1.webp" alt=""></a>
            <a href="#"><img src="images/1.2.webp" alt=""></a>
