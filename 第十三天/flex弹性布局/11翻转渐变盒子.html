<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻转渐变盒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 用 flex 让盒子水平垂直居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* 让页面撑满一屏，方便居中 */
            height: 100vh;
            background-color: #1a1a2e;
        }

        .flip-box {
            /* 添加透视，翻转才更有 3D 立体感 */
            perspective: 800px;
        }

        .flip-inner {
            position: relative;
            width: 200px;
            height: 260px;
            border-radius: 16px;
            /* 保留翻转后的 3D 效果 */
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        /* 鼠标悬停时绕 Y 轴翻转 180 度 */
        .flip-box:hover .flip-inner {
            transform: rotateY(180deg);
        }

        /* 正面和反面共用：铺满整个盒子，绝对定位叠在一起 */
        .flip-front,
        .flip-back {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            /* 翻过去的那一面要隐藏起来，否则会露出来 */
            backface-visibility: hidden;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* 正面：紫→蓝 渐变 */
        .flip-front {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* 反面：先绕 Y 轴转 180 度，让它的背面朝前时内容才是正的 */
        .flip-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
    </style>
</head>

<body>
    <div class="flip-box">
        <div class="flip-inner">
            <div class="flip-front">正面</div>
            <div class="flip-back">反面</div>
        </div>
    </div>
</body>

</html>
