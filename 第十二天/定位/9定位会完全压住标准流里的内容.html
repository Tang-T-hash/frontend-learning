<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .box {
            /* 1.浮动元素不会压住下面标准流的文字 */
            /* float: left; */
            /* 2.绝对定位（固定定位）  会压住下面标准流所有的内容 */
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: pink;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <p>牛来牛来牛来牛来牛来牛来牛来牛来</p>
</body>

</html>
