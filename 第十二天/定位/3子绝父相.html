<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子绝父相</title>
    <style>
        .father {
            position: relative;
            width: 200px;
            height: 400px;
            background-color: pink;
            margin: auto;
        }

        .father .son img {
            position: absolute;
            top: 11px;
            right: -9px;
        }
    </style>
</head>

<body>
    <div class="father">
        <div class="son"><img src="images/1.png" alt=""></div>
    </div>
</body>

</html>
