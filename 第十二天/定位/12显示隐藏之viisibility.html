<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示隐藏之visibility</title>
    <style>
        .baba {
            visibility: hidden;
            display: block;
            width: 200px;
            height: 200px;
            background-color: red;
        }

        .mama {
            width: 200px;
            height: 200px;
            background-color: rgb(94, 255, 0);
        }
    </style>
</head>

<body>
    <div class="baba">爸爸</div>
    <div class="mama">妈妈</div>
</body>

</html>
