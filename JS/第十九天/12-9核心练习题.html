  <style>

    li {
      list-style: none;

    .box {
      display: flex;
      flex-wrap: wrap;

    .box li {
      width: 100px;

      margin: 0 10px 10px 0;

    .box li:nth-child(5n+1) {

    }

    .box li img {
      width: 100%;
      height: 100%;
      border: 2px solid #258DF2;
      border-radius: 10px 0 10px 0;
    }
  </style>
</head>
