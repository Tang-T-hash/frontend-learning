<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

    // 需求1：必须凑齐5个有效年龄
    let arr = []
    while (arr.length < 5) {
      let num = +prompt(`请输入第${arr.length + 1}个有效年龄（0-100岁）`)
      if (num >= 0 && num <= 100) {
        arr.push(num)
      } else {
        alert(`请重新输入0-100岁之间的数字`)
      }
    }
    // 需求2：从有效年龄里筛成年人
    let ago = []
    for (let k = 0; k < arr.length; k++) {
      if (arr[k] >= 18) ago.push(arr[k])
    }
    // 需求3、4：总和与平均值
    let sum = 0
    for (let k = 0; k < arr.length; k++) {
      sum += arr[k]
    }
    let pi = sum / arr.length
    // 需求5：最大最小值
    let max = arr[0]
    let min = arr[0]
    for (j = 1; j < arr.length; j++) {
      max < arr[j] ? max = arr[j] : max
      min > arr[j] ? min = arr[j] : min
    }
    // 需求6：输出结果
    document.write(`有效年龄为：${arr}<br>`)
    document.write(`18岁以上年龄为：${ago}<br>`);
    document.write(`所有年龄的总和为：${sum}<br>`);
    document.write(`所有年龄的平均值为：${pi}<br>`);
    document.write(`最大年龄为：${max}<br>`);
    document.write(`最小年龄为：${min}<br>`);
  </script>
</body>

</html>
