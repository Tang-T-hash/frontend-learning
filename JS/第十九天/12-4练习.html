<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 使用for循环 - 求出数组里 大于5 的i和[4, 9, 5, 20, 3, 11]
    let sum = 0
    let arr = [4, 9, 5, 20, 3, 11]
    for (i = 0; i < arr.length; i++) {
      if (arr[i] > 5) {
        sum += arr[i]
      }
    }
    document.write(sum)
  </script>
</body>

</html>
