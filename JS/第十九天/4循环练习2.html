<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 打印倒三角形星星

    // 外循环打印行数
    for (let i = 1; i <= 5; i++) {
      // 内循环打印几个星星
      for (let j = 1; j <= i; j++) {
        document.write(`⭐`)
      }
      // 换行
      document.write(`<br>`)
    }
  </script>
</body>

</html>
