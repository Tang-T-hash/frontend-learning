<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.用户输入
    let num = prompt('请输入一个数字')

    // 2.如果小于10 就补0 不小于就写原值
    // num = num < 10 ? num = '0' + num : num
    num = num > 10 ? num : num = '0' + num

    // 3.输出结果
    alert(num)
  </script>
</body>

</html>
