<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    function setMoney(yu, chi, huo) {
      let yu = +prompt('请输入银行卡余额')
      let chi = +prompt('请输入当月食宿消费金额')
      let huo = +prompt('请输入当月生活消费金额')
      let res = yu - chi - huo
      return res
    }


    let res = setMoney()
    document.write(`银行卡剩余余额是${res}`);

  </script>
</body>

</html>
