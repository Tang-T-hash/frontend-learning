<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      position: fixed;
      bottom: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <img src="images/ad.png" alt="">
  <script>
    // 1.获取广告图片
    const img = document.querySelector('img')
    // 2.设置5秒后关闭广告
    setTimeout(function () {
      img.style.display = 'none'
    }, 3000)
  </script>
</body>

</html>
