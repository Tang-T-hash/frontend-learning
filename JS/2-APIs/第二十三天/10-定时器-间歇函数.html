<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    function fn() {
      console.log('一秒一次')
    }
    // setInterval(函数名， 间隔时间)   函数名不要加小括号
    let n = setInterval(fn, 1000)
    //setInterval('fn()', 1000)
    // 关闭定时器
    clearInterval(n)
  </script>
</body>

</html>
