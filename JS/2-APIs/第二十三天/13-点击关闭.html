<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      position: relative;
      width: 1000px;
      height: 200px;
      background-color: pink;
      margin: 100px auto;
      text-align: center;
      font-size: 50px;
      line-height: 200px;
      font-weight: 700;
    }

    .box2 {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 20px;
      height: 20px;
      background-color: skyblue;
      text-align: center;
      line-height: 20px;
      font-size: 16px;
      /* display: none; */
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="box2">X</div>
  </div>
  <script>
    // 1.获取事件源
    const box2 = document.querySelector('.box2')
    // 关闭的是大盒子
    const box = document.querySelector('.box')
    // 2.监听事件
    box.addEventListener('click', function () {
      box.style.display = 'none'
    })

  </script>
</body>

</html>
