<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="box"></div>
  <script>
    // 1. 获取div元素
    const box = document.querySelector('.box')
    console.log(box.innerHTML)
    // 2. 修改div元素的内容     对象.innerHTML 属性
    box.innerHTML = '<strong>hello world</strong>'   // 可以解析标签
  </script>
</body>

</html>
