<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年会抽奖</title>
  <style>
    .wrapper {
      width: 840px;
      height: 420px;
      background: url(./images/bg01.jpg) no-repeat center / cover;
      padding: 100px 250px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <strong>传智教育年会抽奖</strong>
    <h1>一等奖：<span id="one">???</span></h1>
    <h3>二等奖：<span id="two">???</span></h3>
    <h5>三等奖：<span id="three">???</span></h5>
  </div>
  <script>
    // 1.声明数组
    const names = ['周杰伦', '刘德华', '周星驰', '王力宏', '张学友'];
    // 2.先做一等奖
    // 2.1 随机数  数组的下标
    const random = Math.floor(Math.random() * names.length);
    // 2.2 获取one 元素     
    const one = document.querySelector('#one')
    // 2.3 把名字给one
    one.innerHTML = names[random]
    // 2.4 删除数组中的这个名字
    names.splice(random, 1)
    // console.log(names)

    // 2.再做二等奖
    // 2.1 随机数  数组的下标
    const random2 = Math.floor(Math.random() * names.length);
    // 2.2 获取two 元素
    const two = document.querySelector('#two')
    // 2.3 把名字给two
    two.innerHTML = names[random2]
    // 2.4 删除数组中的这个名字
    names.splice(random2, 1)
    // console.log(names)

    // 2.再做三等奖
    // 2.1 随机数  数组的下标
    const random3 = Math.floor(Math.random() * names.length);
    // 2.2 获取three 元素
    const three = document.querySelector('#three')
    // 2.3 把名字给three
    three.innerHTML = names[random3]
    // 2.4 删除数组中的这个名字
    names.splice(random3, 1)
    console.log(names)
  </script>
</body>

</html>
