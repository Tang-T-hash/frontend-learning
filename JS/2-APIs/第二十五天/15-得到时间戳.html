<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.getTime()          可以返回指定时间
    const date = new Date()
    console.log(date.getTime())


    // 2.+new Date()       无需实例化      可以返回指定时间
    console.log(+new Date())

    // 3.now()           无需实例化       不能指定时间
    console.log(Date.now())

    console.log(`------------------`)
    console.log(+new Date('2026-10-01 12:00:00'))







  </script>
</body>

</html>
