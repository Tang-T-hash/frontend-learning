<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理（阶段0产物）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      padding: 30px;
      color: #333;
    }

    h1 {
      font-size: 20px;
      margin: 20px 0 12px;
      color: #1f2937;
    }

    /* ===== 表单 ===== */
    .info {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .info label {
      font-size: 14px;
    }

    .info input,
    .info select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    .info input:focus,
    .info select:focus {
      border-color: #2563eb;
    }

    .info .add {
      height: 34px;
      padding: 0 20px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-left: auto;
    }

    .info .add:hover {
      background: #1d4ed8;
    }

    /* ===== 表格 ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    th,
    td {
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #eef0f3;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
      color: #4b5563;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    td a {
      color: #dc2626;
      text-decoration: none;
      font-size: 13px;
    }

    td a:hover {
      text-decoration: underline;
    }

    /* 空数据提示 */
    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 0;
    }
  </style>
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    <label>姓名：<input type="text" class="name" name="name"></label>
    <label>年龄：<input type="text" class="age" name="age"></label>
    <label>性别：
      <select class="gender" name="gender">
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </label>
    <label>家乡：<input type="text" class="hometown" name="hometown"></label>
    <button class="add">录入</button>
  </form>

  <h1>学员列表</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>家乡</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- <td>1732</td>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
      <td>河南省</td>
      <td><a href="javascript:" data-id="1732">删除</a></td>
 -->
    </tbody>
  </table>

  <script>
    // ============================================================
    // 阶段 0 产物 · Step 1：静态渲染
    // 目标：把下面 3 条数据渲染到表格里，每行带一个删除按钮
    // ============================================================

    // ---------- 数据层 ----------

    // 默认数据：只在"第一次打开"（localStorage 里啥都没有）时用
    const defaultArr = [
      { id: 1732, name: '张三', age: 18, gender: '男', hometown: '河南省' },
      { id: 1733, name: '李四', age: 19, gender: '女', hometown: '河北省' },
      { id: 1734, name: '王五', age: 20, gender: '男', hometown: '山东省' },
    ]

    // ============================================================

    // 目标：数组能存进浏览器，刷新页面后还能读回来

    // 【1】写一个 loadData 函数：把数据从 localStorage 读出来

    //        而且这个键第一次根本不存在，返回的是 null —— 必须处理，否则
    //        render() 里 arr.length 直接抛 "Cannot read properties of null"

    //        A. if 判断 null → return defaultArr（首次打开有 3 条示例数据）
    //        B. JSON.parse(...) || []（134 集案例的写法，更短，但首次是空表）

    // 【2】再写一个 saveData 函数：把数组存进去

    // 【3】真身：arr 必须从浏览器里读，不能写死

    //        Step 2 两个函数写完之后，把 [] 换成 loadData()，这一步不能漏
    const arr = []

    // 获取 tbody 元素
    const tbody = document.querySelector('tbody')


    // ---------- 渲染层：render 函数 ----------
    function render() {
      // 【你的任务 1】
      // 思路（三步）：
      //   1. 先把 tbody 清空：tbody.innerHTML = ''
      //   2. for 循环遍历 arr
      //   3. 每一轮：createElement 造一个 tr → 用 innerHTML 填内容 → appendChild 塞进 tbody

      // 每行要长这样（注意：删除按钮的 data-id 要存当前这条的 id）：
      //   <td>1732</td>
      //   <td>张三</td>
      //   <td>18</td>
      //   <td>男</td>
      //   <td>河南省</td>
      //   <td><a href="javascript:" data-id="1732">删除</a></td>

      // TODO: 在这里写你的代码
      tbody.innerHTML = ''
      for (let i = 0; i < arr.length; i++) {
        const tr = document.createElement('tr')
        tr.innerHTML = `
      <td>${arr[i].id}</td>
      <td>${arr[i].name}</td>
      <td>${arr[i].age}</td>
      <td>${arr[i].gender}</td>
      <td>${arr[i].hometown}</td>
      <td><a href="javascript:" data-id="${arr[i].id}">删除</a></td>`
        tbody.appendChild(tr)
      }

    }

    // ---------- 启动：先渲染一次 ----------
    render()

    // ============================================================
    // 阶段 0 产物 · Step 3：新增学员
    // 目标：点「录入」→ 表单的值变成一个新学生对象 → 加进数组 → 存盘 → 重画
    // ============================================================

    // 【1】先拆一颗隐形炸弹：
    //     你的 HTML 用的是 <form class="info">，里面的 <button> 默认 type="submit"
    //     → 一点「录入」，浏览器就会提交表单并【刷新页面】，刚加的数据瞬间消失
    //     → 所以要监听 form 的 submit 事件，并且函数第一行就阻止它的默认行为
    //     ⚠️ 绑在 .info 上，事件名是 'submit'，不是 'click'（这是 105 集的内容）

    // 【2】取四个控件的值（class 分别是 .name .age .gender .hometown）
    //     提示：el.value 才是输入框里的内容；select 也一样用 .value
    //     ⚠️ 从输入框拿到的年龄一定是【字符串】，比如 "20"
    //        Step 5 要拿它算平均年龄，字符串没法直接加 → 现在就转成数字

    // 【3】给新学生一个 id
    //     提示：id 要唯一，而且刷新之后也不能和已有的撞上
    //         —— 你在 117 集学过一个现成工具，返回一个很大的数字，基本不可能重复

    // 【4】把新学生 push 进 arr
    //     ⚠️ push 完页面【不会】自己变：DOM 不知道你的数组变了
    //        必须手动调用上面那个渲染函数，它才会重新画一遍

    // 【5】存盘
    //     提示：调你 Step 2 写的那个存盘函数，把 arr 传进去
    //        不存的话，一刷新数据就没了

    // 【6】清空表单
    //     提示：连 select 一起清掉，form 身上有一个现成方法，一个单词搞定
    //        如果你只会一个一个 input.value = ''，那样也行，但 select 要单独设回默认

    // TODO: 在这里写你的 Step 3 代码（写完在浏览器里验证一次）

    // ========== 下面暂时不用管（Step 4 才做删除） ==========

    //     // 从按钮反查 id → 从数组删掉 → 重画
    //   }
    // })
  </script>
</body>

</html>
