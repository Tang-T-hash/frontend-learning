<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理（阶段0产物）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      padding: 30px;
      color: #333;
    }

    h1 {
      font-size: 20px;
      margin: 20px 0 12px;
      color: #1f2937;
    }

    /* ===== 表单 ===== */
    .info {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .info label {
      font-size: 14px;
    }

    .info input,
    .info select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    .info input:focus,
    .info select:focus {
      border-color: #2563eb;
    }

    .info .add {
      height: 34px;
      padding: 0 20px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-left: auto;
    }

    .info .add:hover {
      background: #1d4ed8;
    }

    /* ===== 表格 ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    th,
    td {
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #eef0f3;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
      color: #4b5563;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    td a {
      color: #dc2626;
      text-decoration: none;
      font-size: 13px;
    }

    td a:hover {
      text-decoration: underline;
    }

    /* 空数据提示 */
    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 0;
    }
  </style>
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    <label>姓名：<input type="text" class="name" name="name"></label>
    <label>年龄：<input type="text" class="age" name="age"></label>
    <label>性别：
      <select class="gender" name="gender">
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </label>
    <label>家乡：<input type="text" class="hometown" name="hometown"></label>
    <button class="add">录入</button>
  </form>

  <h1>学员列表</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>家乡</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- <td>1732</td>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
      <td>河南省</td>
      <td><a href="javascript:" data-id="1732">删除</a></td>
 -->
    </tbody>
  </table>

  <script>
    // ============================================================
    // 阶段 0 产物 · Step 1：静态渲染
    // 目标：把下面 3 条数据渲染到表格里，每行带一个删除按钮
    // ============================================================

    // ---------- 数据层：数组就是"真身" ----------
    const arr = [
      { id: 1732, name: '张三', age: 18, gender: '男', hometown: '河南省' },
      { id: 1733, name: '李四', age: 19, gender: '女', hometown: '河北省' },
      { id: 1734, name: '王五', age: 20, gender: '男', hometown: '山东省' },
    ]

    // 获取 tbody 元素
    const tbody = document.querySelector('tbody')

    // ---------- 渲染层：render 函数 ----------
    function render() {
      // 【你的任务 1】
      // 思路（三步）：
      //   1. 先把 tbody 清空：tbody.innerHTML = ''
      //   2. for 循环遍历 arr
      //   3. 每一轮：createElement 造一个 tr → 用 innerHTML 填内容 → appendChild 塞进 tbody

      // 每行要长这样（注意：删除按钮的 data-id 要存当前这条的 id）：
      //   <td>1732</td>
      //   <td>张三</td>
      //   <td>18</td>
      //   <td>男</td>
      //   <td>河南省</td>
      //   <td><a href="javascript:" data-id="1732">删除</a></td>

      // TODO: 在这里写你的代码
      tbody.innerHTML = ''
      for (let i = 0; i < arr.length; i++) {
        const tr = document.createElement('tr')
        tr.innerHTML = `
      <td>${arr[i].id}</td>
      <td>${arr[i].name}</td>
      <td>${arr[i].age}</td>
      <td>${arr[i].gender}</td>
      <td>${arr[i].hometown}</td>
      <td><a href="javascript:" data-id="${arr[i].id}">删除</a></td>`
        tbody.appendChild(tr)
      }

    }

    // ---------- 启动：先渲染一次 ----------
    render()

    // ========== 下面暂时不用管（Step 4 才做删除） ==========
    // tbody.addEventListener('click', function (e) {
    //   if (e.target.tagName === 'A') {
    //     // 从按钮反查 id → 从数组删掉 → 重画
    //   }
    // })
  </script>
</body>

</html>
