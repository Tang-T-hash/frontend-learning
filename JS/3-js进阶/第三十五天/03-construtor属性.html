<body>
  <script>
    // constructor  英文意思：构造函数
    function Star() {
    }
    console.log(Star.prototype)
    Star.prototype = {

      // 重新指回创建这个原型对象的构造函数
      constructor: Star,

      sing: function () {
        console.log('唱歌')
      },
      dance: function () {
        console.log('跳舞')
      },
    }
    console.log(Star.prototype)
