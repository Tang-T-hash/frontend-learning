<body>
  <script>
    const arr = [{
      name: '张三',
      salary: 10000
    }, {
      name: '李四',
      salary: 10000
    }, {
      name: '王五',
      salary: 10000
    }]

    // 计算薪资案例
    // const total = arr.reduce((prev, current) => prev + current.salary, 0)
    // console.log(total)

    // 上一次值    当前值     返回值   (第一次遍历)
    // 0             10000         10000
    // 上一次值    当前值     返回值   (第二次遍历)
    // 10000       10000            20000
    // 上一次值    当前值     返回值   (第三次遍历)
    // 20000       10000            30000

    //需求: 每个人涨薪 30%   当月支出多少薪资

    const total = arr.reduce((prev, current) => prev + current.salary * 1.3, 0)
    console.log(total)

    // 上一次值       当前值            返回值   (第一次遍历)
    // 0              13000            13000
    // 上一次值       当前值            返回值   (第二次遍历)
    // 13000          13000            26000
    // 上一次值       当前值            返回值   (第三次遍历)
    // 26000          13000            39000


  </script>
