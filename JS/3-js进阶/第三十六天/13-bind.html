<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>点击按钮</button>
  <script>
    const obj = {
      name: '张三'
    }
    function fn() {
      console.log(this)
    }
    // 1. bind  不会调用函数
    //2. 能改变this指向
    // 3. 返回值是个函数，   但是这个函数里面的this是更改过的obj
    const fun = fn.bind(obj)
    fun()



    //需求  有一个按钮  点击里面就禁用， 2秒后重新启用
    document.querySelector('button').addEventListener('click', function () {
      // 点击按钮  禁用按钮
      this.disabled = true
      setTimeout(function () {
        // 在这个普通按钮里面    我们要 this 由原来的 window 改为 btn
        this.disabled = false
      }.bind(this), 2000)
    })
  </script>
</body>

</html>
