<body>
  <script>
    // 1.用户输入用户名 密码
    let username = prompt('请输入用户名')
    let password = prompt('请输入密码')
    // 2.用户名：pink 密码: 123456, 则提示登陆成功，否则失败1
    if (username === 'pink' && password === '123456') {
      alert('登陆成功')
    } else {
      alert('登陆失败')
    }


  </script>
