<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.用户输入学习成绩
    let score = prompt('请输入学习成绩')
    // 2.判断成绩等级
    if (score >= 90) {
      alert('优')
    } else if (score >= 70) {
      alert('良')
    } else if (score >= 60) {
      alert('及格')
    } else {
      alert('不及格')
    }
  </script>
</body>

</html>
