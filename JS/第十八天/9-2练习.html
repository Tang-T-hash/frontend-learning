<body>
  <script>
    // 1.用户输入年龄
    let age = +prompt('请输入年龄')
    // 2.增加五岁
    let age2 = age + 5
    // 3.通过弹窗输出五年后的年龄
    console.log(`据我估计，五年后，你可能:${age2}岁了`)
  </script>
