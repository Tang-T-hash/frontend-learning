<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 20px 40px;
    }

    table {
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <script>
    // 1.用户输入银行卡总额 本月花费的电费 水费 网费
    let bank = +prompt('请输入银行卡总额')
    let elec = +prompt('请输入本月电费')
    let water = +prompt('请输入本月水费')
    let net = +prompt('请输入本月网费')
    // 2.计算银行卡剩余的余额
    let total = bank - elec - water - net
    // 3.表格形式打印出来
    document.write(`
  <table>
    <tr>
      <th>银行卡总额</th>
      <th>本月电费</th>
      <th>本月水费</th>
      <th>本月网费</th>
      <th>本月剩余余额</th>
    </tr>
    <tr>
      <td>${bank}</td>
      <td>${elec}</td>
      <td>${water}</td>
      <td>${net}</td>
      <td>${total}</td>
    </tr>
  </table>
`)

  </script>
</body>

</html>
