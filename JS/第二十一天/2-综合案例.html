<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let time = +prompt(`请输入时间（秒）`)
    function fn(time) {
      let h = parseInt(time / 60 / 60 % 24)
      let m = parseInt(time / 60 % 60)
      let s = parseInt(time % 60)
      h = h < 10 ? h = h + `0` : h
      m = m < 10 ? m = m + `0` : m
      s = s < 10 ? s = s + `0` : s
      return `转换后时间为${h}时${m}分${s}秒`
    }

    let re = fn(time)
    console.log(re);
  </script>
</body>

</html>
