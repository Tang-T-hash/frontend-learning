    // 2.求数组中的最大值和最小值
    function getMax(arr = []) {
      let max = arr[0]
      let min = arr[0]
      for (let i = 1; i < arr.length; i++) {
        // 最大值
        if (arr[i] > max) {
          max = arr[i]
        }
        // 最小值
        if (arr[i] < min) {
          min = arr[i]
        }
      }
      // 返回的是 数组
      return [max, min]
    }
    // 调用函数
    let newArr = getMax([1, 3, 5, 7, 9, 19])
    console.log(`数组最大值是${newArr[0]}`)
    console.log(`数组最小值是${newArr[1]}`)
