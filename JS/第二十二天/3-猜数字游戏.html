<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.程序随机输出1 ~ 10 之间的数字
    // 取N ~ M 的随机整数
    function getRandom(N, M) {
      return Math.floor(Math.random() * (M - N + 1) + N)
    }
    let random = getRandom(1, 10)
    console.log(random)
    // 2.用户随机输入一个数字
    while (true) {
      let num = +prompt('请输入一个数字')
      // 3.判断输出
      if (num > random) {
        alert('你猜的数字太大了')
      } else if (num < random) {
        alert('你猜的数字太小了')
      } else {
        alert('恭喜你猜对了')
        break
      }
    }
  </script>
</body>

</html>
