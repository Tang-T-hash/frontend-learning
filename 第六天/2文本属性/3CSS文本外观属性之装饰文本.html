<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本外观属性之装饰文本</title>
    <style>
        div {
            /* 下划线 */
            text-decoration: underline;
        }
        p {
            /* 删除线 */
            text-decoration: line-through;
        }
        h3 {
            /* 上划线 */
            text-decoration: overline;
        }
        a {
            /* 取消a默认的下划线 */
            text-decoration: none;
            color: #f11616;
        }
    </style>
</head>
<body>
    <div>我原本没想降维打击</div>
    <p>真没胖</p>
    <h3>瘦了</h3>
    <a href="#">不想要下划线</a>
</body>
</html>
