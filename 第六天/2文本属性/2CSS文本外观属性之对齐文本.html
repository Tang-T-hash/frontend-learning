<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本外观属性之对齐文本</title>
    <style>
        h1 {
            /* 本质是让h1盒子里的文字  水平居中对齐 */
        text-align: center;
    }
    p {
        text-align: right;
    }
    </style>
</head>
<body>
    <h1>居中对齐</h1>
    <p>真没胖</p>
</body>
</html>
